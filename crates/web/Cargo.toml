[package]
name = "folio-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
[dependencies]
folio-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "=0.8.14", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-events = "0.2"
uuid = { version = "1", features = ["v4", "js"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "DomRect", "HtmlInputElement", "HtmlDialogElement", "BeforeUnloadEvent", "KeyboardEvent", "Storage", "MediaQueryList", "History", "Location"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.125"
console_error_panic_hook = "0.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
