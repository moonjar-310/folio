name = "folio"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-09-14"
workers_dev = false

[build]
command = "cargo install --locked worker-build --version 0.8.5 && cd crates/worker && worker-build --release"

[assets]
directory = "dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[vars]
APP_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "folio"
# Local placeholder; replace with a real D1 ID before a future deployment.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "NOTES"
bucket_name = "folio-notes"
