name = "folio"
main = "crates/worker/entry.mjs"
compatibility_date = "2026-09-14"
workers_dev = false
preview_urls = false

[placement]
mode = "smart"

# Local emulation only. Production generator replaces this with cloudflare_access.
[vars]
FOLIO_AUTH_METHOD = "password"

[build]
command = "node scripts/build-cloudflare.mjs"
watch_dir = ["crates/core", "crates/application", "crates/adapter", "crates/storage-cloudflare", "crates/worker/src", "crates/worker/Cargo.toml", "crates/web/src", "crates/web/index.html", "crates/web/style.css", "crates/web/Cargo.toml", "crates/web/Trunk.toml", "Cargo.toml", "Cargo.lock", "crates/worker/access.mjs", "crates/worker/entry.mjs", "scripts/build-cloudflare.mjs", "scripts/trunk.mjs"]

[assets]
directory = "dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "folio"
# Replace this local placeholder with the production D1 database ID.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "NOTES"
bucket_name = "folio-notes"
