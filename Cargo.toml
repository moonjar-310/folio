[workspace]
members = ["crates/core", "crates/application", "crates/adapter", "crates/storage-local", "crates/storage-cloudflare", "crates/web", "crates/worker", "crates/local"]
default-members = ["crates/core", "crates/application", "crates/local"]
resolver = "3"
[workspace.package]
edition = "2024"
rust-version = "1.91"
[workspace.dependencies]
folio-core = { path = "crates/core" }
folio-application = { path = "crates/application" }
folio-adapter = { path = "crates/adapter", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = "debuginfo"
