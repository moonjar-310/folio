[workspace]
members = ["crates/core", "crates/web", "crates/worker", "crates/local"]
default-members = ["crates/core", "crates/local"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
folio-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
# Keep WASM target-feature metadata needed by worker-build panic recovery.
strip = "debuginfo"
